name: Isolated D1 migration gate
on:
  workflow_call:
  pull_request:
    paths: ['v4/**','tests/**','.github/workflows/**','package.json','scripts/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-d1:
    runs-on: ubuntu-24.04
    env:
      D1_DATABASE_ID: '00000000-0000-4000-8000-000000000001'
      PUBLIC_ORIGIN: 'https://staging.invalid'
      OWNER_DISCORD_ID: '111111111111111111'
      DISCORD_CLIENT_ID: '222222222222222222'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated configuration
        run: |
          npm run build
          node v4/scripts/prepare.mjs
      - name: Verify seeded financial backup restore and session cleanup
        run: python3 tests/restore-check.test.py
      - name: Apply migrations only to temporary local D1
        run: |
          set -eu
          localdb="$(mktemp -d)"
          trap 'rm -rf "$localdb"' EXIT
          npx --yes wrangler@4.168.0 d1 migrations apply nexoraid-v4 --local --persist-to "$localdb/state" --config v4/.generated/wrangler.json
          npx --yes wrangler@4.168.0 d1 execute nexoraid-v4 --local --persist-to "$localdb/state" --config v4/.generated/wrangler.json --command "SELECT COUNT(*) AS rows_in_empty_ledger FROM cash_movements;"
          npx --yes wrangler@4.168.0 d1 export nexoraid-v4 --local --persist-to "$localdb/state" --config v4/.generated/wrangler.json --output "$localdb/fixture.sql"
          python3 v4/scripts/restore-check.py < "$localdb/fixture.sql"
          npx --yes wrangler@4.168.0 dev --local --persist-to "$localdb/state" --config v4/.generated/wrangler.json --ip 127.0.0.1 --port 8787 --var DISCORD_CLIENT_SECRET:synthetic-ci-only > "$localdb/worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; rm -rf -- "$localdb"' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8787/api/health > "$localdb/health.json"; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat "$localdb/worker.log"; exit 1; fi
          node --input-type=module -e 'import fs from "node:fs";import assert from "node:assert/strict";const h=JSON.parse(fs.readFileSync(process.argv[1]));assert.equal(h.status,"ok");assert.equal(h.database_ready,true);assert.equal(h.release,process.env.GITHUB_SHA);assert.ok(h.schema>=15);' "$localdb/health.json"
          curl --fail --silent --max-time 10 http://127.0.0.1:8787/api/catalog > "$localdb/catalog.json"
          node -e 'const c=require(process.argv[1]);if(!Array.isArray(c.services)||!c.services.length)process.exit(1)' "$localdb/catalog.json"
