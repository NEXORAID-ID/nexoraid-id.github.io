name: Deploy NEXORAID V4
on:
  push:
    branches: [main]
    paths:
      - 'v4/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'styles.css'
      - 'premium.css'
      - 'app.js'
      - 'catalog.js'
      - 'live-catalog.js'
      - 'services-data.js'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-v4-production
  cancel-in-progress: false
jobs:
  security:
    uses: ./.github/workflows/release-security.yml
  staging:
    uses: ./.github/workflows/d1-local-gate.yml
  deploy:
    needs: [security, staging]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: cloudflare-v4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      MAINTENANCE_MODE: ${{ vars.MAINTENANCE_MODE }}
      WEB_RANDOM_ASSIGNMENT_EXCLUSIVE: ${{ vars.WEB_RANDOM_ASSIGNMENT_EXCLUSIVE || 'true' }}
      AUTO_FIXED_INVOICE_ENABLED: ${{ vars.AUTO_FIXED_INVOICE_ENABLED || 'true' }}
      SHARED_CART_ENABLED: ${{ vars.SHARED_CART_ENABLED || 'true' }}
      OWNER_DISCORD_ID: ${{ vars.OWNER_DISCORD_ID }}
      DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      DISCORD_MEMBERSHIP_BOT_TOKEN: ${{ secrets.DISCORD_MEMBERSHIP_BOT_TOKEN }}
      NEXORAID_TICKET_MACHINE_KEY: ${{ secrets.NEXORAID_TICKET_MACHINE_KEY }}
      NEXORAID_BOT_API_KEY: ${{ secrets.NEXORAID_BOT_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID PUBLIC_ORIGIN OWNER_DISCORD_ID DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET DISCORD_MEMBERSHIP_BOT_TOKEN NEXORAID_TICKET_MACHINE_KEY NEXORAID_BOT_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing environment configuration: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the existing cloudflare-v4 GitHub environment. No migrations or deployment were attempted."
            exit 1
          fi
          if ! [[ "$NEXORAID_TICKET_MACHINE_KEY" =~ ^[a-fA-F0-9]{64}$ ]] || ! [[ "$NEXORAID_BOT_API_KEY" =~ ^[a-fA-F0-9]{64}$ ]] || [ "$NEXORAID_TICKET_MACHINE_KEY" = "$NEXORAID_BOT_API_KEY" ]; then
            echo "::error::Invalid or reused machine and actor credentials. No production changes."
            exit 1
          fi
          for name in WEB_RANDOM_ASSIGNMENT_EXCLUSIVE AUTO_FIXED_INVOICE_ENABLED SHARED_CART_ENABLED; do
            if [ "${!name}" != true ] && [ "${!name}" != false ]; then
              echo "::error::Invalid boolean deployment policy: $name"
              exit 1
            fi
          done
          npm test
          SITE_URL="$PUBLIC_ORIGIN" npm run build
          node v4/scripts/prepare.mjs
      - name: Browser regression gate before production changes
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          # Hosted Ubuntu runner includes Chromium runtime libraries; avoid unrelated apt repositories.
          npx playwright install chromium
          node tests/browser.mjs
      - name: Guard financial migrations with verified backup evidence
        env:
          NEXORAID_FINANCE_BACKUP_EVIDENCE: ${{ secrets.NEXORAID_FINANCE_BACKUP_EVIDENCE }}
        run: node v4/scripts/financial-migration-gate.mjs
      - name: Apply D1 migrations and deploy
        run: |
          # Preflight exact Worker build and credentials before altering schema.
          umask 077
          secret_file="$(mktemp)"
          trap 'rm -f -- "$secret_file"' EXIT
          node --input-type=module -e 'process.stdout.write(JSON.stringify({DISCORD_CLIENT_SECRET:process.env.DISCORD_CLIENT_SECRET,DISCORD_MEMBERSHIP_BOT_TOKEN:process.env.DISCORD_MEMBERSHIP_BOT_TOKEN,NEXORAID_TICKET_MACHINE_KEY:process.env.NEXORAID_TICKET_MACHINE_KEY,NEXORAID_BOT_API_KEY:process.env.NEXORAID_BOT_API_KEY}))' > "$secret_file"
          npx --yes wrangler@4.168.0 deploy --dry-run --config v4/.generated/wrangler.json --secrets-file "$secret_file"
          npx --yes wrangler@4.168.0 d1 migrations apply nexoraid-v4 --remote --config v4/.generated/wrangler.json
          npx --yes wrangler@4.168.0 deploy --config v4/.generated/wrangler.json --secrets-file "$secret_file"
      - name: Verify deployment
        run: node v4/scripts/verify.mjs
