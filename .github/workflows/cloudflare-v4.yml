name: Deploy NEXORAID V4
on:
  push:
    branches: [main]
    paths:
      - 'v4/**'
      - 'tests/v4.test.mjs'
      - 'index.html'
      - 'styles.css'
      - 'premium.css'
      - 'app.js'
      - 'catalog.js'
      - 'services-data.js'
      - 'scripts/**'
      - '.github/workflows/cloudflare-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-v4-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: cloudflare-v4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      OWNER_DISCORD_ID: ${{ vars.OWNER_DISCORD_ID }}
      DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID PUBLIC_ORIGIN OWNER_DISCORD_ID DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing environment configuration: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the existing cloudflare-v4 GitHub environment. No migrations or deployment were attempted."
            exit 1
          fi
          npm test
          SITE_URL="$PUBLIC_ORIGIN" npm run build
          node v4/scripts/prepare.mjs
      - name: Apply D1 migrations and deploy
        run: |
          npx --yes wrangler@4 d1 migrations apply nexoraid-v4 --remote --config v4/.generated/wrangler.json
          umask 077
          secret_file="$(mktemp)"
          trap 'rm -f -- "$secret_file"' EXIT
          node --input-type=module -e 'process.stdout.write(JSON.stringify({DISCORD_CLIENT_SECRET:process.env.DISCORD_CLIENT_SECRET}))' > "$secret_file"
          npx --yes wrangler@4 deploy --config v4/.generated/wrangler.json --secrets-file "$secret_file"
      - name: Verify deployment
        run: node v4/scripts/verify.mjs
