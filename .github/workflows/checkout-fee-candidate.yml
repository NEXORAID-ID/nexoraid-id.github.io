name: Checkout fee candidate regression
on:
  pull_request:
    branches: [candidate/reconcile-finance-schema-0019-0023]
    paths: ['v4/**','tests/**','.github/workflows/checkout-fee-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated checkout and finance regression
        run: npm test
      - name: Build candidate without deploying
        run: npm run build

      - name: Combined browser and real Worker regression (no deploy)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
          node tests/browser.mjs
