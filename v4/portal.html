<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"><title>Portal pelanggan — NEXORAID</title><link rel="stylesheet" href="portal.css"><script type="module" src="portal.mjs"></script></head><body><main><header><a href="/">NEXORAID</a><span>Portal V4</span></header><h1>Kelola permintaan layanan</h1><p>Permintaan bukan transaksi pembayaran. Jangan kirim password, OTP, atau data pembayaran.</p><p id="status" role="status" aria-live="polite">Memeriksa koneksi...</p><a id="login" href="/api/auth/login" hidden>Masuk dengan Discord</a><button id="logout" hidden>Keluar</button><section id="account" hidden><h2 id="identity"></h2><form id="request"><label>Layanan<select id="service" required></select></label><label>Jumlah<input id="quantity" type="number" min="1" max="99" value="1" required></label><button>Kirim permintaan</button></form><h2>Daftar permintaan</h2><button id="refresh">Muat ulang</button><div id="orders"></div><form id="team" hidden><h2>Atur peran anggota</h2><label>Discord ID<input id="member" pattern="[0-9]{17,20}" required></label><label>Peran<select id="role"><option>customer</option><option>worker</option><option>seller</option></select></label><button>Simpan peran</button></form></section><p><a href="/kontak.html">Kontak resmi dan tiket Discord</a></p></main></body></html>
